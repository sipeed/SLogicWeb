<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>logicweb</title>
  <!--
    Declaring an icon is what stops the browser probing /favicon.ico at the DOMAIN root -
    which, for a project page served from a subdirectory, is not this site's to serve and
    404s. Vite rewrites this href with the build's base, so it follows the subdirectory.
  -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <script>
    try {
      const stored = localStorage.getItem('logicweb.theme');
      const mode = stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'dark';
      const dark = mode === 'dark' || (mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    } catch {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  </script>
  <script>
    try {
      const raw = localStorage.getItem('logicweb.panelWidth');
      const n = raw === null ? NaN : Number(raw);
      if (Number.isFinite(n) && n > 0) {
        document.documentElement.style.setProperty('--side-panel-w',
          Math.min(560, Math.max(240, Math.round(n))) + 'px');
      }
    } catch {
    }
  </script>
  <link rel="stylesheet" href="/src/ui/style.css" />
</head>
<body>
  <div id="app">
    <div id="toolbar">
      <button id="btn-connect" class="toolbar-item toolbar-device" title="Connect device" aria-label="Device">
        <span class="toolbar-item-media">
          <svg class="toolbar-item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false" data-icon="inline-start">
            <rect x="3" y="4" width="14" height="13" rx="2"></rect>
            <path d="M7 8h6M7 12h3M17 9h4v6h-2a2 2 0 0 1-2-2"></path>
          </svg>
        </span>
        <span class="toolbar-item-label" aria-hidden="true" data-i18n="toolbar.shortDevice">Device</span>
      </button>
      <span class="toolbar-separator" role="separator" aria-orientation="vertical"></span>
      <button id="transport" class="toolbar-item primary" data-i18n-title="toolbar.startTitle" title="Start a capture on the connected device" aria-label="Start">
        <span class="toolbar-item-media">
          <svg class="toolbar-item-icon transport-play" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false" data-icon="inline-start">
            <path d="m8 5 11 7-11 7Z"></path>
          </svg>
          <svg class="toolbar-item-icon transport-stop" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false" data-icon="inline-start">
            <rect x="6" y="6" width="12" height="12" rx="2"></rect>
          </svg>
        </span>
        <span class="toolbar-item-label" aria-hidden="true" data-i18n="toolbar.shortStart">Start</span>
      </button>
      <button id="btn-open" class="toolbar-item" data-i18n-title="toolbar.openTitle" title="Load a sigrok .sr session or a .lwcap" aria-label="Open…">
        <span class="toolbar-item-media">
          <svg class="toolbar-item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false" data-icon="inline-start">
            <path d="M3 7V5a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"></path>
            <path d="M3 7h18"></path>
          </svg>
        </span>
        <span class="toolbar-item-label" aria-hidden="true" data-i18n="toolbar.shortOpen">Open</span>
      </button>
      <button id="btn-save" class="toolbar-item" data-i18n-title="toolbar.saveTitle" title="Save this capture as .lwcap" aria-label="Save">
        <span class="toolbar-item-media">
          <svg class="toolbar-item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false" data-icon="inline-start">
            <path d="M5 3h12l4 4v14H3V3Z"></path>
            <path d="M7 3v6h10V3M7 21v-8h10v8"></path>
          </svg>
        </span>
        <span class="toolbar-item-label" aria-hidden="true" data-i18n="toolbar.shortSave">Save</span>
      </button>
      <button id="btn-fit" class="toolbar-item" data-i18n-title="toolbar.fitTitle" title="Zoom to the whole capture" aria-label="Fit">
        <span class="toolbar-item-media">
          <svg class="toolbar-item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false" data-icon="inline-start">
            <path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"></path>
          </svg>
        </span>
        <span class="toolbar-item-label" aria-hidden="true" data-i18n="toolbar.shortFit">Fit</span>
      </button>
      <span class="toolbar-separator" role="separator" aria-orientation="vertical"></span>
      <button id="btn-settings" class="toolbar-item toolbar-settings" data-i18n-title="settings.titleHint" title="Language and display preferences" aria-label="Settings" aria-controls="settings-menu" aria-expanded="false">
        <span class="toolbar-item-media">
          <svg class="toolbar-item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false" data-icon="inline-start">
            <path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3"></path>
            <path d="M1 14h6M9 8h6M17 16h6"></path>
          </svg>
        </span>
        <span class="toolbar-item-label" aria-hidden="true" data-i18n="toolbar.shortSettings">Settings</span>
      </button>
      <span class="spacer"></span>
      <button id="btn-assistant" class="toolbar-item toolbar-assistant" data-i18n-title="toolbar.assistantTitle" title="AI assistant" aria-label="AI assistant" aria-controls="side-panel" aria-pressed="false">
        <span class="toolbar-item-media">
          <svg class="toolbar-item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false" data-icon="inline-start">
            <path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"></path>
            <path d="M20 3v4M22 5h-4M4 17v2M5 18H3"></path>
          </svg>
        </span>
        <span class="toolbar-item-label" aria-hidden="true" data-i18n="toolbar.shortAssistant">Assistant</span>
      </button>
      <button id="btn-theme" class="toolbar-item toolbar-theme" data-i18n-title="toolbar.themeTitle" title="Toggle theme" aria-label="Toggle theme" aria-controls="theme-menu" aria-expanded="false">
        <span class="toolbar-item-media">
          <svg class="toolbar-item-icon theme-icon-light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false" data-icon="inline-start">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
          </svg>
          <svg class="toolbar-item-icon theme-icon-dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false" data-icon="inline-start">
            <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
          </svg>
          <svg class="toolbar-item-icon theme-icon-system" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false" data-icon="inline-start">
            <rect x="2" y="3" width="20" height="14" rx="2"></rect>
            <path d="M8 21h8M12 17v4"></path>
          </svg>
        </span>
        <span class="toolbar-item-label" aria-hidden="true" data-i18n="toolbar.shortTheme">Theme</span>
      </button>
      <button id="btn-sidebar" class="toolbar-item toolbar-sidebar" data-i18n-title="toolbar.sidebarTitle" title="Choose right sidebar" aria-label="Choose right sidebar" aria-controls="sidebar-menu" aria-expanded="false">
        <span class="toolbar-item-media">
          <svg class="toolbar-item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false" data-icon="inline-start">
            <rect width="18" height="18" x="3" y="3" rx="2"></rect>
            <path d="M15 3v18"></path>
          </svg>
        </span>
        <span class="toolbar-item-label" aria-hidden="true" data-i18n="toolbar.shortSidebar">Sidebar</span>
      </button>
    </div>

    <div id="main">
      <div id="scroll-area">
        <div id="labels-col">
          <div id="labels-spacer"></div>
          <div id="channel-list"></div>
        </div>

        <div id="plot-col">
          <canvas id="axis"></canvas>
          <div id="plot">
            <div id="wave-stack"></div>
            <div id="empty-hint">
              <span data-i18n="emptyHint.line1">No capture loaded.</span><br />
              <span data-i18n="emptyHint.line2">Open a .sr or .lwcap file, or connect an SLogic16/32 U3.</span>
            </div>
          </div>
        </div>
      </div>

      <div id="panel-resizer" role="separator" aria-orientation="vertical" tabindex="0"
           aria-controls="side-panel" aria-label="Resize sidebar"
           data-i18n-aria-label="panel.resizeLabel"
           data-i18n-title="panel.resizeTitle" title="Drag to resize the sidebar"></div>

      <div id="side-panel"></div>
    </div>

    <div id="status"></div>
  </div>

  <input id="file-input" type="file" multiple hidden
         accept=".sr,.lwcap" />
  <script type="module" src="/src/ui/main.ts"></script>
</body>
</html>
